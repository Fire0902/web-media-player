#
# Production nginx configuration for the Hedgehog frontend.
#
# - Serves the Vue SPA from /usr/share/nginx/html with HTML5 fallback.
# - Reverse-proxies API traffic to the AdonisJS backend (service name
#   `api`, port 3333) over the internal docker-compose network, so the
#   backend never needs to expose its port publicly.
# - The SPA's bundle is built with VITE_API_BASE_URL=/api, so every API
#   call lands here at /api/* and gets stripped before being forwarded.
#

upstream hedgehog_api {
    server api:3333;
}

server {
    listen       80;
    server_name  _;

    # Large uploads (and streaming endpoints with big files) should not be
    # capped by nginx's default 1m limit.
    client_max_body_size 0;

    # ── API reverse proxy ───────────────────────────────────────────────
    #
    # Frontend sends:  /api/auth, /api/files, /api/stream/:id, ...
    # Backend expects: /auth,     /files,     /stream/:id,     ...
    # The trailing slash on `proxy_pass` strips the /api prefix.
    location /api/ {
        proxy_pass         http://hedgehog_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Streaming endpoints benefit from disabled buffering + longer reads.
        proxy_buffering    off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── SPA assets ──────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Hashed JS/CSS produced by Vite can be cached aggressively.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Everything else falls back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
